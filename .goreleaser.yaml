# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: release-me

builds:
  - id: release-me
    main: ./cmd/release-me
    binary: release-me
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  # publish.yaml only runs goreleaser on an existing, already published
  # release, so goreleaser never creates one here. mode: keep-existing
  # (goreleaser's default) only keeps release-me's own release notes
  # untouched if that ever changes: it governs ReleaseNotesMode and
  # nothing else, so it does not protect the prerelease flag below.
  mode: keep-existing
  # Left unset, this defaults to false and is sent on every update
  # regardless of mode, overwriting an existing pre-release's flag.
  # auto recomputes it from the tag, matching what release-me's own
  # Forge.CreateRelease call already determined for that tag.
  prerelease: auto
