version: "3"

vars:
  BIN: bin/release-me

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  build:
    desc: Build the CLI into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/release-me

  build:release:
    desc: Build a local snapshot release with goreleaser
    cmds:
      - goreleaser release --snapshot --clean

  build:next:
    desc: Build Next archives and checksums for the current commit
    cmds:
      - scripts/next-build.sh

  run:
    desc: Run the CLI from source, arguments after --
    cmds:
      - go run ./cmd/release-me {{.CLI_ARGS}}

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: Go lint
    cmds:
      - golangci-lint run

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:goreleaser:
    desc: goreleaser configuration lint
    cmds:
      - goreleaser check

  lint:dockerfile:
    desc: Dockerfile lint
    cmds:
      - hadolint Dockerfile

  lint:shell:
    desc: Shell script lint for the composite action and this repository's own CI scripts
    cmds:
      - shellcheck action/*.sh scripts/*.sh

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  test:go:
    desc: Go tests with the race detector
    cmds:
      - go test -race -count=1 -timeout 30m ./...

  test:action:
    desc: Shell script tests for the composite action and this repository's own CI scripts
    cmds:
      - action/resolve-version_test.sh
      - action/build-source_test.sh
      - action/run-release-me_test.sh
      - scripts/publish-release-assets_test.sh

  test:next:
    desc: Next prerelease publication and stale-build guards, without network
    cmds:
      - scripts/next-publish_test.sh

  test:image:
    desc: Build the runtime image and run the CLI against a real git repository
    cmds:
      - scripts/next-image_test.sh

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:goreleaser
      - task: lint:dockerfile
      - task: lint:shell
      - task: lint:secrets
      - task: test:go
      - task: test:action
      - task: test:next
      - task: test:image
      - task: build

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
